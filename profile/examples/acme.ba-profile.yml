# BA project profile — everything that differs between projects. The template and skills do not.
# Lives at docs/BA/specs/.ba-profile.yml in the acme-docs repo.
# What each key means: https://github.com/Relevant-S/ba-tools/blob/main/profile/README.md

profile_version: 2
ba_tools_version: 0.2.0
project: Acme (Acme Lending + Bond Portal)

products:
  - key: acme
    name: Acme Lending
    jira_project: ACME
    roles:
      checked_at: 'acme-app @ origin/main — ROLE_NAMES in src/permission/scripts/build-sync-permissions-payload.ts'
      list:
        - { name: Admin,              code: ADMIN }
        - { name: Loan officer,       code: LOAN_OFFICER }
        - { name: Risk manager,       code: RISK_MANAGER }
        - { name: Accountant,         code: ACCOUNTANT }
        - { name: Compliance officer, code: COMPLIANCE_OFFICER }
        - { name: Agent,              code: AGENT }
        - { name: Customer,           code: CUSTOMER }
      notes:
        - '"Staff" is not a role. It is the PRD''s group name for the staff roles; write the roles out.'
        - 'Accountant has every Risk manager permission.'
        - 'The PRD lists Accountant since v3.0; the Prisma UserRole enum still misses it — ROLE_NAMES is the source.'
  - key: bond-portal
    name: Bond Portal
    jira_project: BOND
    roles:
      checked_at: 'bond-portal-app — one admin flag (isadmin); there are no other roles'
      list:
        - { name: Admin,    code: 'isadmin = true' }
        - { name: Investor, code: 'isadmin = false' }
      notes:
        - 'There is no compliance officer on the Bond Portal — do not carry Acme Lending''s roles across.'

decider_model: single
downstream: [jira]
cadence: release
release_folders: true              # <product>/<release-slug>/<slug>.md — the release must be a real Jira fixVersion; default backlog
conflict_scope: [acme, bond-portal]   # the two products share code, so a rule settled in one can break the other
sizes_requiring_ux: [m, l]

ids:
  format: 'FR{n}'
  source: register
  register: docs/BA/specs/fr-register.md

prd:
  paths: [docs/prd.md]
  shipped_only: true               # a spec's reserved FR enters the PRD only when it ships

code:
  dev_branch: main
  live_branch: prod
  repos:
    - { path: acme-app,          area: Acme Lending backend }
    - { path: acme-auth,         area: Acme Lending backend — auth }
    - { path: acme-documents,    area: Acme Lending backend — documents }
    - { path: acme-notification, area: Acme Lending backend — notifications }
    - { path: loan-calculation,        area: Acme Lending — loan maths library }
    - { path: bond-portal-app,         area: Bond Portal backend }
    - { path: acme-client,       area: both frontends (apps/acme, apps/bond-portal, packages/*) }

jira:
  site: example.atlassian.net
  default_issuetype: Task          # Bug only for a true regression
  priorities: [Blocker, Critical, Major, Medium, Minor, Trivial]   # this Jira has no "High" — use Major
  ticket_body: short               # 2–4 sentences + spec link (+ Figma link). Never the spec body.

spec_links:
  repo_url: https://github.com/acme-co/acme-docs
  branch: ba-tools                 # docs/BA exists only on this branch

client_review: clarification-pages   # where the client answers — the page the BA shares on the call
client_representations: [figma]   # how the client sees the requirements; comments on these are extra client input

# The project's "area" in each tool — shared by everyone on the project. Personal keys never go here.
tools:
  client_emails:                   # whose email and whose calls count as client input (fetch-gmail, fetch-fireflies)
    include: ['@acme.example']   # a whole domain, or single addresses
    exclude: [help@acme.example]
  slack:
    channels: [acme-release-support, acme-requirements, bond-requirements]
  figma:
    files:
      - { key: SampleFileKey01AbCdEfG, name: 'Acme Lending (Copy)',  product: acme,      use: designs }
      - { key: SampleFileKey02AbCdEfG, name: 'Bond Portal',     product: bond-portal, use: designs }
      - { key: SampleFileKey03AbCdEfG, name: 'Custom DS',           product: both,            use: design-system }
  confluence: {}                   # not used on this project
