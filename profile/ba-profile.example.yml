# BA project profile — everything that differs between projects. The template and skills do not.
# Copy to docs/BA/specs/.ba-profile.yml in your project and replace every '<...>'.
# `ba-setup project` fills most of it in for you. What each key means: profile/README.md in ba-tools.

profile_version: 2
ba_tools_version: 0.12.0
project: '<display name>'

products:
  - key: '<folder name and the spec product value, e.g. my-product>'
    name: '<on-screen product name>'
    jira_project: '<Jira project key, or ->'
    design_profile: 'docs/BA/design-system/<folder>/design-profile.yml'   # what figma-build reads — ba-setup design writes it
    roles:
      checked_at: '<repo @ origin/branch — the file the role names come from>'
      list:                                   # every real role, in the order section 11 should show them
        - { name: '<on-screen name>', code: '<code name>' }
      notes: []                               # traps, e.g. whether "Staff" is a role or a group name

decider_model: '<single | multi>'
downstream: ['<jira | prd>']
cadence: '<release | phase>'
release_folders: false                        # true when specs sit in one folder per Jira release
conflict_scope: ['<product keys>']
sizes_requiring_ux: [m, l]

ids:
  format: 'FR{n}'                             # how a new capability's id is written; {n} is the number
  source: '<register | highest-existing>'
  register: docs/BA/specs/fr-register.md      # when source is register
  scan: []                                    # when source is highest-existing — every folder ids can appear in

prd:
  paths: ['<path to the PRD, or the PRD folder>']
  shipped_only: false

code:
  dev_branch: '<the branch developers merge into>'
  live_branch: '<the branch that is in production>'
  repos:
    - { path: '<repo folder, relative to the project root>', area: '<what it covers>' }

jira:                                         # delete this block when downstream has no jira
  site: '<yourcompany.atlassian.net>'
  default_issuetype: Task
  priorities: ['<the priority names this Jira has>']
  ticket_body: short

spec_links:
  repo_url: '<https://github.com/org/repo>'
  branch: '<branch the specs live on>'

client_review: clarification-pages            # where the client answers — the page the BA shares on the call
client_representations: [figma]               # how the client sees the requirements (add feature-brief if you use
                                              # Confluence); comments on these are extra client input

# The project's "area" in each tool — shared by everyone on the project. Personal keys never go here.
tools:
  client_emails:                              # whose email and whose calls count as client input
    include: ['<@client-domain.com, or a single address>']
    exclude: ['<no-reply or help-desk addresses>']
  client_contacts:                            # the client people who answer questions — the Portal's "Waiting on you"
    - { name: '<full name>', email: '<email, optional>', slack: '<Slack name or member id, optional>' }
  portal:                                     # the Relevant Clients Portal — portal-publish sends the dashboard here
    url: '<the Portal address, e.g. http://localhost:3000>'   # the Publish key goes in .env (PORTAL_PUBLISH_KEY), never here
    # products: { '<product name>': PORTAL_PUBLISH_KEY_<NAME> }   # two or more products only: each is its own Portal project; the .env variable that holds its key
  slack:
    channels: ['<channel name without #>']
  figma:
    files:
      - { key: '<file key from the Figma URL>', name: '<file name>', product: '<product key>', use: '<designs | design-system>' }
  dashboard:                                  # the BA dashboard page (Map + Board) — ba-dashboard starts one after the brief
    file: docs/BA/dashboard.yaml
    url: '<the published dashboard link>'
    page: docs/BA/mind-map/mind-map.html      # what gets published
    map:                                      # optional
      # products: { PROJ: Product name }      # Jira project -> product name, when dashboard.yaml spells it differently
      stage_of_status:                        # Jira status -> stage; unlisted statuses use Jira's status group
        In Review: qa                         # list every "being tested" status as qa
  dictionary:                                 # the data dictionary — data-dictionary skill
    config: docs/BA/data-dictionary.config.yaml
  messages:                                   # every automatic message — messages skill
    file: docs/BA/messages.yaml
  doc_templates:                              # delete when the project has no generated-document templates
    folder: <drive folder id>                 # the folder the documents service reads, by exact file name
    folder_name: <Product → Folder>           # how the BA finds it in Drive
    company: <Company Ltd.>                   # footer text before the first "|"
    test_api: https://<documents service on dev>/api
    never_api: <documents service on production>
    log: docs/BA/tools/doc-templates/README.md
  confluence:                                 # delete when the project does not use Confluence
    space: '<space key>'
    parent: '<page id new pages go under>'
