[project]
name = "timeline"
version = "0.1.0"
description = "timeline skill: build.py (the timeline page and its data), and its tests"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
