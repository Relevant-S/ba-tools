<title>{{DOC_TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: questions column on the left; a sticky side panel on the right with progress, Send and the
   timeline (decisions + stage changes). One column on phones, side panel first.
   Palette and font = the BA dashboard and mind map. Static text uses entities: these pages carry no
   charset of their own (the artifact wrapper supplies it). */
:root {
  --paper: #f3f6f6; --card: #ffffff; --ink: #111d1c; --ink-2: #3d4f4d; --ink-3: #6b7c7a;
  --rule: #d3dddc; --rule-soft: #e6eceb; --accent: #0d5b60; --accent-bg: #e2eeee; --on-accent: #ffffff;
  --wait: #9c5c05; --wait-bg: #f8eddc; --ok: #2c6b47; --ok-bg: #e2efe7;
  --st-concept: #8a9694; --st-concept-bg: #edf1f1; --st-spec: #7046c2; --st-spec-bg: #efe9fa;
  --st-ready: #2457c5; --st-ready-bg: #e5ecfb; --st-dev: #b0306e; --st-dev-bg: #f9e6ef;
  --st-qa: #b98900; --st-qa-bg: #fbf2d6; --st-done: #2c7a45; --st-done-bg: #e2efe7;
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1414; --card: #151f1e; --ink: #e8efee; --ink-2: #aebbb9; --ink-3: #7d8d8b;
    --rule: #2a3736; --rule-soft: #1e2a29; --accent: #5cc2c6; --accent-bg: #14302f; --on-accent: #0d1414;
    --wait: #e0a44e; --wait-bg: #33260f; --ok: #6fca94; --ok-bg: #15301f;
    --st-concept: #8a9b99; --st-concept-bg: #1b2625; --st-spec: #b59af5; --st-spec-bg: #261f3b;
    --st-ready: #82a8f5; --st-ready-bg: #182540; --st-dev: #ef7fb5; --st-dev-bg: #3a1a2a;
    --st-qa: #e9c24b; --st-qa-bg: #33290c; --st-done: #6fca94; --st-done-bg: #15301f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1414; --card: #151f1e; --ink: #e8efee; --ink-2: #aebbb9; --ink-3: #7d8d8b;
  --rule: #2a3736; --rule-soft: #1e2a29; --accent: #5cc2c6; --accent-bg: #14302f; --on-accent: #0d1414;
  --wait: #e0a44e; --wait-bg: #33260f; --ok: #6fca94; --ok-bg: #15301f;
  --st-concept: #8a9b99; --st-concept-bg: #1b2625; --st-spec: #b59af5; --st-spec-bg: #261f3b;
  --st-ready: #82a8f5; --st-ready-bg: #182540; --st-dev: #ef7fb5; --st-dev-bg: #3a1a2a;
  --st-qa: #e9c24b; --st-qa-bg: #33290c; --st-done: #6fca94; --st-done-bg: #15301f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font); }
a { color: var(--accent); }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.s-concept { --c: var(--st-concept); --cb: var(--st-concept-bg); }
.s-spec { --c: var(--st-spec); --cb: var(--st-spec-bg); }
.s-ready { --c: var(--st-ready); --cb: var(--st-ready-bg); }
.s-dev { --c: var(--st-dev); --cb: var(--st-dev-bg); }
.s-qa { --c: var(--st-qa); --cb: var(--st-qa-bg); }
.s-done { --c: var(--st-done); --cb: var(--st-done-bg); }

.wrap { max-width: 1140px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
aside { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 40px); overflow-y: auto; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.crumbs { font-size: 14px; color: var(--ink-3); margin: 0; }
.crumbs b { color: var(--ink); font-weight: 500; }
h1 { margin: 0; font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--ink-2); font-size: 16px; max-width: 64ch; }
.lede strong { color: var(--ink); }
.round { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--cb); color: var(--c); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; }
.card h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
.card p { margin: 0 0 10px; color: var(--ink-2); max-width: 70ch; }
.card p:last-child { margin-bottom: 0; }
.card strong { color: var(--ink); }
.ps { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.design-sum p { margin: 0 0 10px; color: var(--ink-2); }
figure { margin: 14px 0 0; }
figure img { width: 100%; border-radius: 8px; border: 1px solid var(--rule); display: block; }
figcaption { font-size: 13px; color: var(--ink-3); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-start; justify-content: space-between; }
figcaption span { flex: 1 1 260px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: var(--on-accent); text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--card); color: var(--ink-2); border: 1px solid var(--rule); }
.btn.back { padding: 6px 12px 6px 10px; font-size: 13.5px; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn svg { width: 14px; height: 14px; }
.btn svg path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.disc { margin-top: 14px; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.disc svg { transition: transform .15s; }
.disc[aria-expanded="true"] svg { transform: rotate(180deg); }
.dpanel { margin-top: 10px; }
.design-detail p { color: var(--ink-2); }
.design-where { font-size: 13px; color: var(--ink-3); }
#open { display: flex; flex-direction: column; gap: 20px; }
.section-h { margin: 12px 0 -6px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.q { scroll-margin-top: 20px; }
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.q-meta { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.badge { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.badge.need { background: var(--wait-bg); color: var(--wait); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.q h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; line-height: 1.35; }
.q-body p { margin: 0 0 8px; color: var(--ink-2); font-size: 14.5px; }
.q-body .lead { color: var(--ink); }
.q-body blockquote { margin: 8px 0; padding: 8px 14px; border-radius: 8px; background: var(--rule-soft); font-style: italic; color: var(--ink-2); }
.q-body cite { display: block; font-style: normal; font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.snag { background: var(--wait-bg); border-radius: 8px; padding: 10px 14px; margin: 8px 0; font-size: 14px; }
.snag p { margin: 0; color: var(--ink); }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.opt { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%; border: 1px solid var(--rule); background: var(--card); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.opt:hover { border-color: var(--ink-3); }
.opt[aria-checked="true"] { border: 1.5px solid var(--accent); background: var(--accent-bg); padding: 11.5px 13.5px; }
.radio { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--ink-3); position: relative; }
.opt[aria-checked="true"] .radio { border-color: var(--accent); }
.opt[aria-checked="true"] .radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
.opt-t { font-weight: 500; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rec { font-size: 11.5px; font-weight: 600; background: var(--accent-bg); color: var(--accent); border-radius: 6px; padding: 1px 8px; }
.opt[aria-checked="true"] .rec { background: var(--card); }
.opt-d { display: block; font-size: 14px; color: var(--ink-3); margin-top: 2px; }
label.note { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
label.note span { color: var(--ink-3); font-weight: 400; }
textarea { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; background: var(--card); font-size: 14px; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.none-open { text-align: center; padding: 28px 22px; }
.none-open h2 { font-size: 18px; }

details.answered { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; }
details.answered > summary { list-style: none; cursor: pointer; padding: 16px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-weight: 600; font-size: 16px; }
details.answered > summary::-webkit-details-marker { display: none; }
details.answered > summary .chev { width: 16px; height: 16px; transition: transform .15s; color: var(--ink-3); }
details.answered > summary .chev path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
details.answered[open] > summary .chev { transform: rotate(90deg); }
details.answered > summary small { font-weight: 400; color: var(--ink-3); font-size: 14px; }
.dlist { border-top: 1px solid var(--rule-soft); }
.dec { padding: 14px 22px; border-bottom: 1px solid var(--rule-soft); scroll-margin-top: 20px; }
.dec:last-child { border-bottom: 0; }
.dec.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-bg); } to { background: transparent; } }
.dec-top { display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.dec h4 { margin: 0; font-size: 15px; font-weight: 600; }
.dec p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.dec .who { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.change { margin-top: 10px; }
.change .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.flag { font-size: 12px; font-weight: 600; color: var(--wait); }

.side-h { margin: 0 0 10px; font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.side-h span { font-size: 14px; font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .2s; }
.qlist { list-style: none; margin: 12px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.qlist a { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; text-decoration: none; color: var(--ink); font-size: 14px; }
.qlist a.is-done { color: var(--ink-3); }
.ic { width: 16px; height: 16px; margin-top: 2px; }
.ic path, .ic circle { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.qlist a.is-done .ic { color: var(--ok); }
.qlist a:not(.is-done) .ic { color: var(--wait); }
.actions { display: flex; flex-direction: column; gap: 8px; }
.actions .btn { width: 100%; padding: 10px 14px; }
.sendnote { font-size: 12.5px; color: var(--ink-3); margin: 8px 0 0; }
.sendnote.warn { color: var(--wait); font-weight: 500; }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--rule-soft); }
.tl-day { position: relative; padding-left: 24px; margin-bottom: 14px; }
.tl-day:last-child { margin-bottom: 0; }
.tl-dot { position: absolute; left: 0; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink-3); }
.tl-dot.stage { background: var(--c); border-color: var(--c); }
.tl-date { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.tl-item { margin-top: 4px; font-size: 14px; }
.tl-item .who { color: var(--ink-3); font-size: 12.5px; }
.tl-dec { position: relative; padding-left: 12px; }
.tl-dec::before { content: ""; position: absolute; left: 2px; top: 10px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }
.tl-item button { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); cursor: pointer; font-size: 14px; }
.tl-item button:hover { color: var(--accent); text-decoration: underline; }
.tl-item .chg { color: var(--wait); font-weight: 600; font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 14px; transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; max-height: none; order: -1; }
  .ps { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <main>
    <div class="topbar">{{BACK}}<p class="crumbs">Clarifications &rsaquo; <b>{{CRUMB}}</b></p></div>
    <header>
      <h1>{{H1}}</h1>
      <div class="lede">{{DESCRIPTION}}</div>
      <div class="round">{{STAGE_PILL}}<span>{{ROUND}}</span></div>
    </header>

{{PROBLEM_SOLUTION}}

{{DESIGN}}

    <div id="open"></div>

    <details class="answered" id="answered" hidden>
      <summary><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg>Answered questions <small id="ans-count"></small></summary>
      <div class="dlist" id="dlist"></div>
    </details>
  </main>

  <aside>
    <section class="card" id="answers-card">
      <h2 class="side-h">Your answers <span id="prog-t"></span></h2>
      <div class="bar"><i id="prog"></i></div>
      <ul class="qlist" id="qlist"></ul>
      <div class="actions">
      {{ACTIONS}}
      </div>
      <p class="sendnote" id="save">Saved in this browser as you go. You can send now and answer the rest later.</p>
    </section>
    <section class="card" id="timeline-card">
      <h2 class="side-h">Timeline</h2>
      <ol class="tl" id="tl"></ol>
    </section>
  </aside>
</div>
<span class="toast" id="toast" role="status"></span>
<script>
(function () {
  "use strict";

  var DATA = {{DATA_JSON}};
  var QUESTIONS = DATA.questions, DECISIONS = DATA.decisions, EVENTS = DATA.events, STAGES = DATA.stages;
  var STORE_KEY = {{STORE_KEY}};
  var COPY_HEADER = {{COPY_HEADER}};
  var DB_DOC = {{DB_DOC}};
  var ICON_OK = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5l4.5-5"/></svg>';
  var ICON_OPEN = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5"/></svg>';

  /* One state object, kept in this browser: a pick and a note per open question, and a requested
     change per decision already made. */
  var state = { picks: {}, notes: {}, changes: {} };
  try {
    var saved = JSON.parse(window.localStorage.getItem(STORE_KEY) || "null");
    if (saved) {
      if (saved.picks) { state = { picks: saved.picks || {}, notes: saved.notes || {}, changes: saved.changes || {} }; }
      else { Object.keys(saved).forEach(function (k) {  // the old page kept {id: {choice, notes}}
        if (saved[k] && saved[k].choice) { state.picks[k] = saved[k].choice; }
        if (saved[k] && saved[k].notes) { state.notes[k] = saved[k].notes; }
      }); }
    }
  } catch (err) { /* a corrupt or blocked store just means starting fresh */ }
  function save() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (err) { stamp("This browser cannot keep your answers — send or copy them before closing", true); }
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fmt(iso) {
    var d = new Date(iso + "T00:00:00Z");
    return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  }
  var elSave = document.getElementById("save");
  function stamp(msg, warn) { elSave.textContent = msg; elSave.classList.toggle("warn", !!warn); }
  var toast = document.getElementById("toast");
  function flash(msg) { toast.textContent = msg; toast.classList.add("on"); setTimeout(function () { toast.classList.remove("on"); }, 2400); }

  /* ---------- Open questions, grouped by section ---------- */
  function renderOpen() {
    var host = document.getElementById("open");
    if (!QUESTIONS.length) {
      host.innerHTML = '<section class="card none-open"><h2>No open questions</h2><p>Everything on this page has been answered. The decisions and the timeline stay here as the record.</p></section>';
      return;
    }
    var html = "", section = null;
    QUESTIONS.forEach(function (q, i) {
      if (q.section && q.section !== section) { section = q.section; html += '<h2 class="section-h">' + esc(section) + '</h2>'; }
      var picked = state.picks[q.id];
      html += '<section class="card q" id="' + esc(q.id) + '">' +
        '<div class="q-top"><span class="q-meta">Question ' + (i + 1) + (q.meta ? ' &middot; ' + esc(q.meta) : '') + '</span>' +
        '<span class="badge ' + (picked ? 'ok' : 'need') + '" id="b-' + esc(q.id) + '">' + (picked ? 'Answered' : 'Needs your answer') + '</span></div>' +
        '<h3>' + esc(q.title) + '</h3><div class="q-body">' + q.body;
      if (q.quote) { html += '<blockquote>&ldquo;' + esc(q.quote.text) + '&rdquo;<cite>' + esc(q.quote.cite) + '</cite></blockquote>'; }
      if (q.body2) { html += q.body2; }
      html += '</div>';
      if (q.snag) { html += '<div class="snag">' + q.snag + '</div>'; }
      (q.screens || []).forEach(function (scr) {
        html += '<figure><img src="' + scr.src + '" alt="' + esc(scr.cap) + '" loading="lazy"><figcaption><span>' + esc(scr.cap) + '</span>' +
          (scr.figma ? '<a class="btn ghost small" href="' + esc(scr.figma) + '" target="_blank" rel="noopener">Open in Figma</a>' : '') + '</figcaption></figure>';
      });
      html += '<div class="opts" role="radiogroup" aria-label="' + esc(q.title) + '">';
      q.options.forEach(function (o) {
        html += '<button type="button" class="opt" role="radio" aria-checked="' + (picked === o.v) + '" data-q="' + esc(q.id) + '" data-v="' + esc(o.v) + '">' +
          '<span class="radio" aria-hidden="true"></span><span><span class="opt-t">' + esc(o.t) +
          (o.rec ? '<span class="rec">Our recommendation</span>' : '') + '</span><span class="opt-d">' + esc(o.d) + '</span></span></button>';
      });
      html += '</div><label class="note" for="n-' + esc(q.id) + '">' + esc(q.note) + ' <span>(optional)</span></label>' +
        '<textarea id="n-' + esc(q.id) + '" data-q="' + esc(q.id) + '" placeholder="' + esc(q.notePlaceholder) + '">' + esc(state.notes[q.id] || "") + '</textarea>' +
        '<div class="hint">Your BA sees this note with your answer.</div></section>';
    });
    host.innerHTML = html;
    Array.prototype.forEach.call(host.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-q");
        state.picks[id] = b.getAttribute("data-v"); save(); stamp("Saved in this browser");
        Array.prototype.forEach.call(host.querySelectorAll('.opt[data-q="' + id + '"]'), function (x) { x.setAttribute("aria-checked", x === b); });
        var badge = document.getElementById("b-" + id); badge.className = "badge ok"; badge.textContent = "Answered";
        renderSide();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll("textarea"), function (t) {
      t.addEventListener("input", function () { state.notes[t.getAttribute("data-q")] = t.value; save(); });
    });
  }

  /* ---------- Answered questions: collapsed; each can be changed ---------- */
  function renderAnswered() {
    var box = document.getElementById("answered");
    if (!DECISIONS.length) { box.hidden = true; return; }
    box.hidden = false;
    var list = DECISIONS.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    document.getElementById("ans-count").textContent = list.length + " · newest first · you can change any of them";
    document.getElementById("dlist").innerHTML = list.map(function (dc) {
      var ch = state.changes[dc.id];
      var when = [dc.date ? "Decided " + fmt(dc.date) : "Decided", dc.who ? "by " + esc(dc.who) : "", dc.how ? esc(dc.how) : ""].filter(Boolean).join(" ").replace(" by", " by");
      return '<div class="dec" id="d-' + esc(dc.id) + '"><div class="dec-top"><div><h4>' + esc(dc.title) + '</h4>' +
        (dc.detail ? '<p>' + esc(dc.detail) + '</p>' : '') +
        '<div class="who">' + when + (ch ? ' &middot; <span class="flag">Change requested</span>' : '') + '</div></div>' +
        '<button class="linkbtn" data-change="' + esc(dc.id) + '">' + (ch ? 'Edit change' : 'Change this answer') + '</button></div>' +
        '<div class="change" id="c-' + esc(dc.id) + '" hidden><label class="note" for="t-' + esc(dc.id) + '">What should it be instead?</label>' +
        '<textarea id="t-' + esc(dc.id) + '" placeholder="Describe the new answer…">' + esc(ch || "") + '</textarea>' +
        '<div class="row"><button class="btn small" data-keep="' + esc(dc.id) + '">Save the change</button>' +
        '<button class="btn ghost small" data-cancel="' + esc(dc.id) + '">' + (ch ? 'Withdraw the change' : 'Cancel') + '</button></div></div></div>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("[data-change]"), function (b) {
      b.addEventListener("click", function () {
        var c = document.getElementById("c-" + b.getAttribute("data-change"));
        c.hidden = !c.hidden; if (!c.hidden) { c.querySelector("textarea").focus(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-keep]"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-keep"), v = document.getElementById("t-" + id).value.trim();
        if (v) { state.changes[id] = v; } else { delete state.changes[id]; }
        save(); renderAnswered(); renderSide(); renderTimeline();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-cancel]"), function (b) {
      b.addEventListener("click", function () { delete state.changes[b.getAttribute("data-cancel")]; save(); renderAnswered(); renderSide(); renderTimeline(); });
    });
  }

  /* ---------- Side panel: progress ---------- */
  function renderSide() {
    var card = document.getElementById("answers-card");
    var n = QUESTIONS.filter(function (q) { return state.picks[q.id]; }).length;
    var c = Object.keys(state.changes).length;
    if (!QUESTIONS.length && !DECISIONS.length) { card.hidden = true; return; }
    document.getElementById("prog-t").textContent = QUESTIONS.length ? n + " of " + QUESTIONS.length : "all answered";
    document.getElementById("prog").style.transform = "scaleX(" + (QUESTIONS.length ? n / QUESTIONS.length : 1) + ")";
    document.getElementById("qlist").innerHTML = QUESTIONS.map(function (q, i) {
      return '<li><a href="#' + esc(q.id) + '" class="' + (state.picks[q.id] ? 'is-done' : '') + '">' + (state.picks[q.id] ? ICON_OK : ICON_OPEN) +
        '<span>' + (i + 1) + ' &middot; ' + esc(q.title) + '</span></a></li>';
    }).join("");
    var send = document.getElementById("send");
    if (send && !send.disabled) {
      send.textContent = c ? (QUESTIONS.length ? "Send answers and " : "Send ") + c + " change" + (c > 1 ? "s" : "") : "Send answers";
    }
  }

  /* ---------- Timeline: decisions, rounds and stage changes, newest first ---------- */
  function renderTimeline() {
    var days = {};
    DECISIONS.forEach(function (dc) { if (dc.date) { (days[dc.date] = days[dc.date] || []).push({ kind: "decision", dc: dc }); } });
    EVENTS.forEach(function (ev) { (days[ev.date] = days[ev.date] || []).push({ kind: ev.kind, ev: ev }); });
    var order = Object.keys(days).sort().reverse();
    if (!order.length) { document.getElementById("timeline-card").hidden = true; return; }
    document.getElementById("tl").innerHTML = order.map(function (day) {
      var its = days[day];
      var stage = its.filter(function (it) { return it.kind === "stage"; })[0];
      var decs = its.filter(function (it) { return it.kind === "decision"; });
      var who = decs.map(function (it) { return it.dc.who; }).filter(function (w, i, a) { return w && a.indexOf(w) === i; });
      var html = '<li class="tl-day"><span class="tl-dot' + (stage ? ' stage s-' + esc(stage.ev.stage) : '') + '"></span><div class="tl-date">' + fmt(day) + '</div>';
      its.filter(function (it) { return it.kind !== "decision"; }).forEach(function (it) {
        var ev = it.ev;
        html += '<div class="tl-item">' + (it.kind === "stage" ? '<span class="pill s-' + esc(ev.stage) + '"><span class="dot"></span>' + esc(STAGES[ev.stage] || ev.stage) + '</span> ' : '') +
          esc(ev.title) + (ev.who ? ' <span class="who">&middot; ' + esc(ev.who) + '</span>' : '') + '</div>';
      });
      if (decs.length) {
        html += '<div class="tl-item"><span class="who">' + (who.length ? esc(who.join(", ")) + ' decided:' : 'Decided:') + '</span></div>';
        decs.forEach(function (it) {
          html += '<div class="tl-item tl-dec"><button data-jump="' + esc(it.dc.id) + '">' + esc(it.dc.title) + '</button>' +
            (state.changes[it.dc.id] ? ' <span class="chg">change requested</span>' : '') + '</div>';
        });
      }
      return html + '</li>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("[data-jump]"), function (b) {
      b.addEventListener("click", function () {
        document.getElementById("answered").open = true;
        var el = document.getElementById("d-" + b.getAttribute("data-jump"));
        el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
        el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
      });
    });
  }

  /* ---------- What goes back: clipboard text for a person, a structured record for Claude ---------- */
  function answersText() {
    var out = [COPY_HEADER, "Answered " + new Date().toLocaleDateString(), ""];
    QUESTIONS.forEach(function (q, i) {
      var pick = q.options.filter(function (o) { return o.v === state.picks[q.id]; })[0];
      out.push((i + 1) + ". " + q.title);
      out.push("   Answer: " + (pick ? pick.t : "— not answered —"));
      if ((state.notes[q.id] || "").trim()) { out.push("   Notes: " + state.notes[q.id].trim()); }
      out.push("");
    });
    DECISIONS.forEach(function (dc) {
      if (state.changes[dc.id]) { out.push("Change to “" + dc.title + "”: " + state.changes[dc.id]); }
    });
    return out.join("\n");
  }
  function answersPayload() {
    var rows = QUESTIONS.map(function (q, i) {
      var pick = q.options.filter(function (o) { return o.v === state.picks[q.id]; })[0];
      return { n: i + 1, id: q.id, spec_ref: q.spec_ref || null, question: q.title,
               answer: pick ? pick.t : null, answer_value: state.picks[q.id] || null,
               notes: (state.notes[q.id] || "").trim() || null };
    });
    var changes = DECISIONS.filter(function (dc) { return state.changes[dc.id]; }).map(function (dc) {
      return { id: dc.id, decision: dc.title, decided: dc.date || null, new_answer: state.changes[dc.id] };
    });
    return { page: DB_DOC, title: COPY_HEADER, saved_at: new Date().toISOString(),
             answered: rows.filter(function (r) { return r.answer; }).length, total: rows.length,
             answers: rows, changes: changes };
  }

  var copyBtn = document.getElementById("copy");
  if (copyBtn) {
    copyBtn.addEventListener("click", function () {
      var text = answersText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { flash("Copied — paste it into Slack or an email to your BA"); },
          function () { flash("Copying was blocked by this browser"); });
      } else { flash("Copying is not available in this browser"); }
    });
  }
  // Send writes the answer set into the artifact's own store (collection "answers", doc "latest"),
  // which the BA's Claude session reads back. Hidden until the store answers; a local file has no
  // window.claude, so the clipboard stays the route there.
  var elSend = document.getElementById("send");
  if (elSend && window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (db) {
      if (!db) { return; }
      elSend.hidden = false;
      renderSide();
      elSend.addEventListener("click", function () {
        var label = elSend.textContent;
        elSend.disabled = true; elSend.textContent = "Sending…";
        db.doc("answers/latest").set(answersPayload()).then(
          function () { elSend.disabled = false; elSend.textContent = label; flash("Sent to your BA"); stamp("Sent — " + new Date().toLocaleTimeString()); },
          function (err) {
            var code = (err && err.code) ? err.code : "unknown";
            elSend.disabled = false; elSend.textContent = label;
            stamp("Could not send (" + code + ") — use Copy all answers", true);
          });
      });
    }, function () {});
  }

  /* ---------- The design disclosure ---------- */
  (function () {
    var btn = document.getElementById("dmore"), panel = document.getElementById("dpanel");
    if (!btn || !panel) { return; }
    btn.addEventListener("click", function () {
      var open = panel.hidden;
      panel.hidden = !open; btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  })();

  renderOpen(); renderAnswered(); renderSide(); renderTimeline();
})();
</script>
