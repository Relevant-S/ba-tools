questions:
- id: q1-transferee-vs-grant
  spec_ref: O-D
  section: A — The one that holds a screen up
  title: Whose list of heirs wins — the one they chose at sign-up, or the grant of probate?
  meta: Decides — what the release screen does when the two disagree
  body: |-
    <p class="lead">Your answer on 11 September settled <em>who</em> types the split in: an Admin, working from the executor's written instruction. This is the thing sitting underneath it.</p>
    <p>When an investor signs up they name a <strong>single transferee</strong> &mdash; one person, &ldquo;in the event of death&rdquo;. We already hold that on the record and the release screen shows it. A <strong>grant of probate</strong> can name <strong>several</strong> heirs in different shares, and it does not have to agree with a nomination made years earlier.</p>
    <p>So when the screen shows one name and the executor's instruction says four people at 25% each, <strong>which does the Admin follow?</strong></p>
  snag: |-
    <p><strong>Our reading is that the grant wins</strong> &mdash; it is the legal instrument and it is current, where the nomination is a preference recorded years before. But we do not want to build that in quietly. The nomination is a field the investor filled in deliberately, it will still be on the screen, and an Admin who sees two answers and no rule will pick one.</p>
  options:
  - v: grant-wins
    t: The grant of probate wins, always
    d: Our suggestion. The nomination stays on screen for context but never decides anything, and we label it so an Admin cannot mistake it for an instruction.
    rec: true
  - v: nomination-if-matches
    t: Follow the nomination when it agrees with the grant, flag it when it does not
    d: Feels safer, but the system cannot do that comparison reliably — a name match is not proof, and a part-match needs a human anyway. In practice it becomes the option above with extra steps.
  - v: drop-nomination
    t: Stop showing the nomination on the release screen at all
    d: Cleanest screen and no ambiguity, but you lose a fact the investor recorded on purpose, and it may still matter in cases where no grant has been produced yet.
  - v: other
    t: Something else
    d: Describe it in the box below.
  note: If the grant always decides, is there still a reason to collect the nominated transferee at sign-up?
  note_placeholder: Optional…
- id: q2-readonly-compliance
  spec_ref: O-E
  section: B — Not a build question
  title: Does anyone outside this project need to see the read-only login decision?
  meta: Decides — whether this is recorded beyond a design document
  body: |-
    <p class="lead">Nothing here is blocked and we are not asking you to change your answer. We are asking where it should be written down.</p>
    <p>You chose to leave a dead person's login open but read-only. That is in the spec and it is buildable as it stands.</p>
    <p>The part that came back blank was the other half: <strong>does compliance already know</strong> that relatives use a dead person's credentials? Read-only stops them changing anything, but they can still read statements, holdings and personal details belonging to someone who has died. That is a data-protection matter rather than a probate one, which is why we would rather ask than assume.</p>
  snag: |-
    <p><strong>Why we are asking at all.</strong> If this is known and accepted, one sentence from you puts it on the record as a decision rather than leaving it looking like something nobody noticed. If it is not known, it is better found now than during an audit.</p>
  options:
  - v: known-accepted
    t: It is known and accepted — record it and move on
    d: Our suggestion if that is the case. We note it in the spec as a deliberate decision with your name against it, and build the read-only rule as answered. Nothing else changes.
    rec: true
  - v: raise-with-compliance
    t: Raise it with compliance before we build the rule
    d: We hold the read-only behaviour until you come back. Everything else in probate carries on — this is the only piece that would wait.
  - v: revisit
    t: Change the answer — disable the login after all
    d: Small to swap. Read-only becomes a hard block, and the estate is served by an Admin from the moment death is recorded.
  - v: other
    t: Something else
    d: Describe it in the box below.
  note: Is this worth a line in the privacy policy or the investor agreement rather than only our spec?
  note_placeholder: Optional…
- id: q3-empty-the-wallet
  spec_ref: O-F
  section: C — The last of the money
  title: Who empties the estate's wallet, and is an estate ever formally finished?
  meta: Decides — whether anything reminds us the money is there
  body: |-
    <p class="lead">You said the wallet must be emptied at the end rather than left to sit. Agreed, and written down. What is not settled is <strong>who notices</strong>.</p>
    <p>When the last certificate matures, the principal lands in the estate's wallet. Today <strong>nothing tells anyone it is there</strong> &mdash; and by then the estate may have been quiet for a year.</p>
    <p>There is also no state on the record that says an estate is finished. That means nobody can answer &ldquo;which estates are still holding money?&rdquo; without going through them one at a time.</p>
  options:
  - v: admin-prompted
    t: The system flags it, an Admin pays it out
    d: Our suggestion. A deceased investor with a wallet balance and no live certificates appears on a list, and an Admin clears it to the bank account already captured at release. Small to build, and it answers the reporting question at the same time.
    rec: true
  - v: admin-manual
    t: An Admin does it when they notice
    d: Nothing to build. It relies on someone remembering months after the estate went quiet, which is exactly how dormant balances happen.
  - v: close-the-estate
    t: Add a proper "estate closed" step that pays out and locks the record
    d: Most to build, but you get a real answer to whether an estate is done, and a report of the ones that are not.
  - v: other
    t: Something else
    d: Describe it in the box below.
  note: Is there a legal point at which an estate is wound up that we should be recording against the investor?
  note_placeholder: Optional…
