standfirst: |-
  <strong>You answered all three questions on 11 September, so everything we had asked you is now
  settled.</strong> Eleven decisions are written into the spec with your wording. What is below is
  not a re-ask &mdash; each of your three answers left one narrow gap that we cannot close
  ourselves. <strong>Only question 1 blocks anything</strong>: without it the release screen shows
  two different lists of heirs and the Admin has to guess.
design:
  label: What this feature is
  more_label: The rest of the design, and where it has got to
  summary: |-
    <p>When a shareholder dies, money stops leaving their holdings until the executor produces
    the grant of probate &mdash; and then <strong>one release pays out everything that was
    withheld</strong>. Death is recorded once on the person, not on each certificate, so every
    holding that death affects pauses together.</p>
    <p>Seven screens are drawn and thirty-four acceptance criteria are written. The three
    questions below are the only things still open.</p>
  detail: |-
    <p>The design deliberately keeps the executor out of the platform. There is no executor
    login: an Admin keys the split from the executor&rsquo;s written instruction, and that
    instruction is filed alongside the grant of probate, so the record shows what was keyed, by
    whom, and against what.</p>
    <p>Interest keeps accruing through the hold. A joint holding only pauses once every holder
    has died &mdash; where rights of survivorship apply the surviving holder takes the shares
    directly and no hold should fire at all.</p>
