description: >-
  What happens to an investor&rsquo;s shares and money when they die. You have answered every question
  we asked; <strong>three narrow follow-ups are left</strong>, and only question 1 holds up a screen.
problem: >-
  When a shareholder dies, the platform has no way to hold their shares. Interest keeps being paid out
  to the dead person&rsquo;s account, and the only fix is a manual correction afterwards.
solution: >-
  Death is <strong>recorded once on the person</strong>, and every holding it affects pauses together.
  Money stops leaving while interest keeps accruing. When the executor brings the grant of probate,
  <strong>one release</strong> pays out everything that was withheld.
