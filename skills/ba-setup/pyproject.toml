[project]
name = "ba-setup"
version = "0.1.0"
description = "ba-setup skill: scripts/setup.py checks the BA's keys and the project profile, and `connect` swaps a one-time Portal code for a key in .env (pyyaml; connect also needs httpx and jsonschema, for portal-publish's targets.py and checks.py)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema[format-nongpl]>=4.23,<5",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
