<title>BA Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a pannable mind map on the left (product hub → areas → features → items), a detail panel on the right; stacked on phones. */
:root {
  --paper: #f3f6f6; --card: #ffffff; --ink: #111d1c; --ink-2: #3d4f4d; --ink-3: #6b7c7a;
  --rule: #d3dddc; --rule-soft: #e6eceb; --accent: #0d5b60; --accent-bg: #e2eeee;
  --spec: #2457c5; --spec-bg: #e5ecfb; --design: #5b45a8; --design-bg: #ece8f7; --dev: #2c6b47; --dev-bg: #e2efe7; --build: #b0306e; --build-bg: #f9e6ef;
  --st-concept: #8a9694; --st-concept-bg: #edf1f1; --st-spec: #7046c2; --st-spec-bg: #efe9fa;
  --st-ready: #2457c5; --st-ready-bg: #e5ecfb; --st-dev: #b0306e; --st-dev-bg: #f9e6ef;
  --st-qa: #b98900; --st-qa-bg: #fbf2d6; --st-done: #2c7a45; --st-done-bg: #e2efe7;
  --wait: #9c5c05; --wait-bg: #f8eddc; --over: #a3282a; --over-bg: #f8e5e4;
  --open: #7f918f; --open-bg: #edf1f1;
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1414; --card: #151f1e; --ink: #e8efee; --ink-2: #aebbb9; --ink-3: #7d8d8b;
    --rule: #2a3736; --rule-soft: #1e2a29; --accent: #5cc2c6; --accent-bg: #14302f;
    --spec: #82a8f5; --spec-bg: #182540; --design: #a994f0; --design-bg: #251f3b; --dev: #6fca94; --dev-bg: #15301f; --build: #ef7fb5; --build-bg: #3a1a2a;
    --st-concept: #8a9b99; --st-concept-bg: #1b2625; --st-spec: #b59af5; --st-spec-bg: #261f3b;
    --st-ready: #82a8f5; --st-ready-bg: #182540; --st-dev: #ef7fb5; --st-dev-bg: #3a1a2a;
    --st-qa: #e9c24b; --st-qa-bg: #33290c; --st-done: #6fca94; --st-done-bg: #15301f;
    --wait: #e0a44e; --wait-bg: #33260f; --over: #ef8886; --over-bg: #351b1b;
    --open: #8a9b99; --open-bg: #1b2625; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1414; --card: #151f1e; --ink: #e8efee; --ink-2: #aebbb9; --ink-3: #7d8d8b;
  --rule: #2a3736; --rule-soft: #1e2a29; --accent: #5cc2c6; --accent-bg: #14302f;
  --spec: #82a8f5; --spec-bg: #182540; --design: #a994f0; --design-bg: #251f3b; --dev: #6fca94; --dev-bg: #15301f; --build: #ef7fb5; --build-bg: #3a1a2a;
    --st-concept: #8a9b99; --st-concept-bg: #1b2625; --st-spec: #b59af5; --st-spec-bg: #261f3b;
    --st-ready: #82a8f5; --st-ready-bg: #182540; --st-dev: #ef7fb5; --st-dev-bg: #3a1a2a;
    --st-qa: #e9c24b; --st-qa-bg: #33290c; --st-done: #6fca94; --st-done-bg: #15301f;
  --wait: #e0a44e; --wait-bg: #33260f; --over: #ef8886; --over-bg: #351b1b;
  --open: #8a9b99; --open-bg: #1b2625; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--font); }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--card); border-bottom: 1px solid var(--rule); }
.brand { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
.brand small { display: block; font-size: 0.75rem; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 0.85rem; min-width: 0; flex: 1; }
.crumbs button { background: none; border: 0; padding: 2px 6px; border-radius: 6px; cursor: pointer; color: var(--accent); }
.crumbs button:hover { background: var(--accent-bg); }
.crumbs span.sep { color: var(--ink-3); }
.crumbs span.here { padding: 2px 6px; color: var(--ink); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--paper); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 3px 12px; font-size: 0.8rem; cursor: pointer; color: var(--ink-2); }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--card); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 3px 10px 3px 7px; cursor: pointer; font-size: 0.8rem; }
.filtering .chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--card); font-weight: 600; }
.chip[aria-pressed="true"] .glyph { stroke: var(--card); }
.chip.reset { padding: 3px 7px; }
.chip.reset:disabled { opacity: 0.35; cursor: default; }
.chip.reset:not(:disabled) .glyph { stroke: var(--over); }
.chip svg, .ico { width: 15px; height: 15px; flex: none; }

.mapwrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
svg.map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
svg.map.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-size: 1rem; line-height: 1; }
.example { position: absolute; left: 12px; bottom: 12px; font-size: 0.72rem; color: var(--ink-3); background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 8px; max-width: calc(100% - 80px); }

.edge { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.node { cursor: pointer; }
.node .fill { fill: var(--card); stroke: var(--rule); stroke-width: 1; }
.node .track { fill: none; stroke: var(--rule-soft); }
.node:hover .fill, .node:focus-visible .fill { stroke: var(--ink-3); }
.node:focus { outline: none; }
.dim { opacity: 0.18; }
.half { opacity: 0.45; }
.lbl { fill: var(--ink); font: 600 19px var(--font); }
.flbl { fill: var(--ink); font: 600 17px var(--font); }
.sub { fill: var(--ink-3); font: 400 14px var(--font); }
.num { fill: var(--ink); font: 700 20px var(--font); }
.hub-t { fill: var(--ink); font: 700 22px var(--font); }
.hub-s { fill: var(--ink-3); font: 400 13px var(--mono); }
.clbl { fill: var(--ink); font: 400 16px var(--font); }
.clbl.on { font-weight: 600; }
.clbl.more { fill: var(--accent); font-weight: 600; }
.clbl.res { fill: var(--ink-3); text-decoration: line-through; }
.node.res .bubble { fill: var(--st-done-bg); stroke: var(--st-done); }
.node.res .glyph { stroke: var(--st-done); }
.res-t { text-decoration: line-through; color: var(--ink-3); }
.unotes { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; color: var(--ink-2); }
.unotes .age { font: 400 0.72rem var(--mono); color: var(--ink-3); margin-right: 6px; }
label.unote { display: block; font-size: 0.85rem; font-weight: 600; margin: 4px 0 6px; }
#u-note { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; background: var(--card); color: var(--ink); font: inherit; font-size: 0.9rem; }
.ucheck { display: flex; gap: 8px; align-items: center; margin: 10px 0; font-size: 0.9rem; cursor: pointer; }
.ucheck input { width: 16px; height: 16px; accent-color: var(--st-done); }
.urow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.urow .btn { border: 0; cursor: pointer; }
aside .m { font-size: 0.85rem; color: var(--ink-3); margin: 0; }
.ititle { display: flex; gap: 8px; align-items: flex-start; }
.ititle h2 { flex: 1; min-width: 0; }
.copylink { flex: none; margin-top: 2px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--rule); border-radius: 8px; background: var(--card); cursor: pointer; }
.copylink:hover { border-color: var(--ink-3); background: var(--rule-soft); }
.copied { margin: 2px 0 6px; overflow-wrap: anywhere; }
.copied:empty { display: none; }
.qbadge { fill: var(--over); }
.qbadge-t { fill: var(--card); font: 700 12px var(--font); }

/* Status colours: one token pair per status, used by rings, outlines, pills and the legend. */
.s-epic { --c: var(--accent); --cb: var(--accent-bg); }
.s-concept { --c: var(--st-concept); --cb: var(--st-concept-bg); }
.s-spec { --c: var(--st-spec); --cb: var(--st-spec-bg); }
.s-ready { --c: var(--st-ready); --cb: var(--st-ready-bg); }
.s-dev { --c: var(--st-dev); --cb: var(--st-dev-bg); }
.s-qa { --c: var(--st-qa); --cb: var(--st-qa-bg); }
.s-done { --c: var(--st-done); --cb: var(--st-done-bg); }
.seg { fill: none; stroke-linecap: butt; }
.seg.track { stroke: var(--rule-soft); }
.seg.fillx { stroke: var(--c); }
.wbadge { fill: #ea6a00; }
.clink { cursor: pointer; }
.clink circle { fill: var(--card); stroke: var(--accent); stroke-width: 1.5; }
.clink path { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.clink:hover circle, .clink:focus-visible circle { fill: var(--accent-bg); }
.tick { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.s-hot { --c: var(--over); --cb: var(--over-bg); }
.s-old { --c: var(--wait); --cb: var(--wait-bg); }
.s-open, .s-none { --c: var(--open); --cb: var(--open-bg); }
.ring { fill: none; stroke: var(--c); stroke-linecap: round; }
.ring-none { fill: none; stroke: var(--open); stroke-dasharray: 3 4; }
.bubble { fill: var(--cb); stroke: var(--c); stroke-width: 2; }
.bubble.more { fill: var(--card); stroke: var(--ink-3); stroke-dasharray: 3 3; }
.glyph { fill: none; stroke: var(--c); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.more .glyph, .glyph.muted { stroke: var(--ink-3); }

aside { min-width: 0; min-height: 0; overflow-y: auto; background: var(--card); border-left: 1px solid var(--rule); padding-block: 18px 32px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
aside h2 { margin: 0 0 4px; font-size: 1.2rem; line-height: 1.25; text-wrap: balance; }
aside h3 { margin: 22px 0 8px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
aside p { margin: 0 0 10px; color: var(--ink-2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--cb, var(--rule-soft)); color: var(--c, var(--ink-2)); white-space: nowrap; }
.pill.plain { background: var(--rule-soft); color: var(--ink-2); font-weight: 500; }
.ready { margin: 6px 0 14px; }
.bar { height: 8px; border-radius: 4px; background: var(--rule-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c); }
.bar.stack { display: flex; gap: 2px; background: none; }
.ready small { display: block; margin-top: 4px; color: var(--ink-3); font-size: 0.78rem; }
ol.qs { margin: 0; padding-left: 20px; color: var(--ink-2); }
ul.txt { margin: 0 0 10px; padding-left: 20px; color: var(--ink-2); }
ul.txt li { margin-bottom: 4px; }
ol.qs li { margin-bottom: 6px; }
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
ul.items button { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; }
ul.items button:hover, ul.items a.row:hover { background: var(--rule-soft); }
ul.items a.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 6px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; }
ul.items .ico { margin-top: 2px; }
ul.items .age { font: 400 0.72rem var(--mono); color: var(--ink-3); margin-top: 2px; }
ul.items .side { display: flex; gap: 4px; align-items: center; margin-top: 1px; }
.legend { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px 10px; align-items: center; font-size: 0.85rem; color: var(--ink-2); }
.legend svg { width: 22px; height: 22px; }
table.sum { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
table.sum th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px; border-bottom: 1px solid var(--rule); }
table.sum td { padding: 5px 4px; border-bottom: 1px solid var(--rule-soft); font-variant-numeric: tabular-nums; }
table.sum td.n, table.sum th.n { text-align: right; }
table.sum td.n { color: var(--ink-2); }
table.sum button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); text-align: left; }
/* The clarification page opens in a new tab, so it stays a link but looks like a button. */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--card); font-weight: 600; font-size: 0.88rem; text-decoration: none; }
.btn:hover { filter: brightness(1.1); }
.btn .glyph { stroke: var(--card); }
.back { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 0.85rem; margin-bottom: 10px; }
.who { font-size: 0.85rem; color: var(--ink-2); margin-bottom: 12px; }
.who b { color: var(--ink); font-weight: 600; }

/* Board: rows are Jira releases, columns are areas, one card per feature. Item lanes sit on top. */
.mapwrap, .boardwrap { grid-column: 1; grid-row: 2; }
.boardwrap { min-width: 0; min-height: 0; overflow: auto; }
.board { display: grid; grid-template-columns: 190px repeat(var(--n), 212px); width: max-content; min-width: 100%; }
.board .ch { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule-soft); padding: 8px 10px; font-size: 0.82rem; font-weight: 700; }
.board .ch small { display: block; font-weight: 400; color: var(--ink-3); }
.board .rl { position: sticky; left: 0; z-index: 1; background: var(--card); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px; font-size: 0.82rem; }
.board .ch.corner { left: 0; z-index: 3; border-right: 1px solid var(--rule); }
.rl b { display: block; font-size: 0.88rem; line-height: 1.25; }
.rl .rn { display: block; color: var(--ink-2); line-height: 1.3; margin-top: 2px; }
.rl .rd { display: block; margin-top: 6px; color: var(--ink-3); font-size: 0.75rem; }
.rl .rd.late { color: var(--wait); font-weight: 600; }
.rl select { margin-top: 6px; width: 100%; font: inherit; font-size: 0.78rem; padding: 3px 4px; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); color: var(--ink); }
.rl.lane { background: var(--paper); }
.board .bc { border-right: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule); padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 44px; }
.board .bc.lane { background: var(--paper); }
.bcard, .bitem { position: relative; display: block; width: 100%; text-align: left; border: 1px solid var(--rule); border-left: 4px solid var(--c); background: var(--card); border-radius: 8px; padding: 6px 8px; cursor: pointer; }
.bcard:hover, .bitem:hover { border-color: var(--ink-3); border-left-color: var(--c); }
.bcard.on, .bitem.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.bcard .bt, .bitem .bt { display: flex; gap: 6px; align-items: flex-start; font-weight: 600; font-size: 0.84rem; line-height: 1.3; }
.bcard .bt > span:not(.bk) { flex: 1; min-width: 0; }
.bitem .bt { font-weight: 500; }
.bcard .bt .ico, .bitem .bt .ico { margin-top: 1px; }
.bcard .bs { display: block; margin-top: 3px; font-size: 0.74rem; color: var(--c); font-weight: 600; }
.bcard .bs span { color: var(--ink-3); font-weight: 400; }
.bitem .bs { display: block; margin-top: 2px; font-size: 0.72rem; color: var(--ink-3); }
.bcard .bk { flex: none; display: flex; gap: 3px; align-items: center; }
.bk:empty { display: none; }
.controls, #chips { min-width: 0; }
.bk i { font-style: normal; min-width: 18px; height: 18px; border-radius: 9px; color: #fff; font-size: 0.7rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
.bk i.q { background: var(--over); }
.bk i.w { background: #ea6a00; }
.bk .ico { width: 16px; height: 16px; }
.bitem.res .bt span { text-decoration: line-through; color: var(--ink-3); }
.board-empty { padding: 24px; color: var(--ink-3); }
.lanet { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.lanecount { align-self: flex-start; background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; color: var(--ink-2); cursor: pointer; }
.lanecount:hover { border-color: var(--ink-3); }
.board .bc.lane:has(.lanecount), .board .bc.lane:empty { min-height: 0; }
/* Search: part of a name → a list of areas, features and items; picking one opens it on the map. */
.search { position: relative; }
.search input { width: 230px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 0.8rem; background: var(--paper); color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--card); }
.search ul { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; width: min(440px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; margin: 0; padding: 4px; list-style: none; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.14); }
.search li { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; line-height: 1.3; }
.search li .ico { margin-top: 2px; }
.search li[aria-selected="true"] { background: var(--accent-bg); }
.search li .t { flex: 1; min-width: 0; }
.search li small { display: block; font-size: 0.74rem; color: var(--ink-3); }
.search li .k { flex: none; font-size: 0.74rem; color: var(--ink-2); }
.search li.res .t > span { text-decoration: line-through; color: var(--ink-3); }
.search li.none { cursor: default; color: var(--ink-2); }
.search mark { background: none; color: inherit; font-weight: 700; }
.search li.all { border-bottom: 1px solid var(--rule-soft); border-radius: 6px 6px 0 0; margin-bottom: 2px; font-weight: 600; color: var(--accent); }
.search li.all small { font-weight: 400; }
.chip[hidden] { display: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 58vh auto; height: auto; }
  .crumbs { order: 3; flex-basis: 100%; }
  .controls, #chips { flex-basis: 100%; }
  .board { grid-template-columns: 120px repeat(var(--n), 190px); }
  .board .rl { padding: 8px; }
  .search { flex-basis: 100%; }
  .search input { width: 100%; }
  aside { border-left: 0; border-top: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1 class="brand">BA mind map<small id="updated">Example built from the BA dashboard</small></h1>
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <div class="controls">
      <div class="search">
        <input id="q" type="search" placeholder="Search by name  ( / )" autocomplete="off" spellcheck="false" aria-label="Search areas, features and items by name" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="q-list">

  if (on) { qIn.setAttribute("aria-activedescendant", on.id); on.scrollIntoView({ block: "nearest" }); }
}
function showHits() {
  const s = qIn.value.trim().toLowerCase();
  if (s.length < 2) { qHits = []; closeSearch(); return; }
  qHits = searchAll(s); qAt = 0;
  qList.innerHTML = qHits.length ? qHits.map((h, i) => `<li role="option" id="q-${i}" data-i="${i}"${h.all ? ' class="all"' : h.done ? ' class="res"' : ""}>${icon(h.ico, h.st)}<span class="t"><span>${h.all ? esc(h.title) : hl(h.title, s)}</span><small>${h.kind}${h.where ? " · " + esc(h.where) : ""}${h.done ? " · resolved" : ""}</small></span>${PRODUCTS.length > 1 && !h.all ? `<span class="k">${esc(h.prod)}</span>` : ""}</li>`).join("")
    : `<li class="none">Nothing has “${esc(qIn.value.trim())}” in its name.</li>`;
  qList.hidden = false; qIn.setAttribute("aria-expanded", "true"); markHit();
}
function chooseHit(h) {
  if (!h) return;
  qIn.value = ""; closeSearch(); qIn.blur();
  if (h.all) { nameQ = h.s; epic = feat = null; applyFilter(); return; }  // stays on the tab you are on
  openTarget(h.e, h.f, h.item); setTab("map"); refresh(true);
}
qIn.addEventListener("input", showHits);
qIn.addEventListener("focus", showHits);
qIn.addEventListener("blur", () => setTimeout(closeSearch, 120));
qIn.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { ev.stopPropagation(); if (qIn.value) { qIn.value = ""; closeSearch(); } else qIn.blur(); return; }
  if (!qHits.length) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); qAt = (qAt + (ev.key === "ArrowDown" ? 1 : -1) + qHits.length) % qHits.length; markHit(); }
  else if (ev.key === "Enter") { ev.preventDefault(); chooseHit(qHits[qAt]); }
});
qList.addEventListener("mousedown", ev => { const li = ev.target.closest("li[data-i]"); if (li) { ev.preventDefault(); chooseHit(qHits[+li.dataset.i]); } });
// "/" jumps to the search box, unless you are already typing somewhere.
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) { ev.preventDefault(); qIn.focus(); }
});
window.addEventListener("hashchange", () => {
  if (location.hash === "#board") { if (view !== "board") { setTab("board"); refresh(false); } }
  else if (openFromHash()) { setTab("map"); refresh(true); }
});

document.getElementById("updated").textContent = "Built from the BA dashboard and Jira, " + DATA.updated;
if (location.hash === "#board") setTab("board"); else openFromHash();
setView(); refresh(false);
// The store answers late (never during this first run) and only on the published page.
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("db").then(db => {
    if (!db) return;
    DB = db;
    db.collection("resolutions").onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = d.data(); });
      RES = m;
      const typing = document.activeElement && document.activeElement.id === "u-note";
      if (view === "board") renderBoard(); else render();
      if (!typing) { const top = panel.scrollTop; renderPanel(); panel.scrollTop = top; }
    }, () => {});
    renderPanel();
  }, () => {});
}
requestAnimationFrame(fitFocus);
window.addEventListener("resize", fitFocus);
</script>
